backend:
  name: git-gateway
  branch: main

media_folder: "images"
public_folder: "/images"

locale: es

collections:
  - name: "posts"
    label: "Textos"
    folder: "posts"
    create: true
    slug: "{{slug}}"
    fields:
      - { label: "Título", name: "title", widget: "string" }
      - { label: "Autor/a", name: "author", widget: "string", required: false }
      - { label: "Fecha", name: "date", widget: "datetime", format: "YYYY-MM-DD", date_format: "DD/MM/YYYY", time_format: false }
      - label: "Categoría"
        name: "category"
        widget: "select"
        options:
          - { label: "Ensayo", value: "Ensayo" }
          - { label: "Nota de cátedra", value: "Nota de cátedra" }
          - { label: "Texto de trabajo", value: "Texto de trabajo" }
          - { label: "Traducción", value: "Traducción" }
          - { label: "Reseña", value: "Reseña" }
      - { label: "Extracto", name: "excerpt", widget: "text", hint: "Breve descripción que aparece en la lista (2-3 oraciones)" }
      - { label: "Cuerpo del texto", name: "body", widget: "markdown" }
